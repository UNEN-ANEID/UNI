name: feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Generar el feed real
        run: |
          python tools/build_feed.py
          if [ -d "site/tools" ]; then
            python site/tools/build_feed.py || true
          fi

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/posts site/data site/assets/posts
          if git diff --cached --quiet; then
            echo "sin cambios en el feed"
          else
            git commit -m "chore: feed automatico de las redes"
            git push
          fi
